<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enforcement Console</title>
<style>
:root {
  --bg: #080b0f;
  --surface: #0f1419;
  --surface2: #161d26;
  --border: #1e2733;
  --border2: #2a3444;
  --fg: #dce6f0;
  --muted: #5d7a96;
  --accent: #e8edf2;
  --dim: #8faabb;

  /* status / severity */
  --high: #c8352a;
  --high-bg: #1a0a09;
  --high-text: #f0877f;
  --med: #b07120;
  --med-bg: #1a1008;
  --med-text: #e8b46a;
  --low: #1f6fa8;
  --low-bg: #080f1a;
  --low-text: #7ab5e8;
  --ok: #1f8a3f;
  --ok-bg: #081409;
  --ok-text: #6dca8a;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
  font-size: 12px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ---- layout ---- */
#app { display: flex; flex-direction: column; height: 100vh; }

header {
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 24px;
  background: var(--surface);
  flex-shrink: 0;
}

.brand {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
}

.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ok-text);
  animation: pulse 2s infinite;
  flex-shrink: 0;
}
.live-dot.dead { background: var(--high-text); animation: none; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.stats-row {
  display: flex;
  gap: 20px;
  font-size: 11px;
  color: var(--muted);
  flex: 1;
}
.stats-row .val { color: var(--fg); font-weight: 600; }
.stats-row .val.high { color: var(--high-text); }
.stats-row .val.warn { color: var(--med-text); }
.stats-row .val.ok { color: var(--ok-text); }

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 11px;
  color: var(--muted);
}
.user-tag {
  padding: 3px 8px;
  border: 1px solid var(--border2);
  border-radius: 4px;
  color: var(--dim);
}

/* ---- tabs ---- */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
  padding: 0 20px;
}
.tab {
  padding: 8px 14px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
}
.tab:hover { color: var(--dim); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ---- filter bar ---- */
.filterbar {
  padding: 10px 20px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}

input, select {
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--border2);
  padding: 5px 10px;
  border-radius: 4px;
  font: inherit;
  outline: none;
}
input:focus, select:focus { border-color: var(--dim); }
input::placeholder { color: var(--muted); }

.btn {
  padding: 5px 12px;
  border-radius: 4px;
  border: 1px solid var(--border2);
  font: inherit;
  cursor: pointer;
  background: var(--surface2);
  color: var(--fg);
  transition: border-color 0.15s;
}
.btn:hover { border-color: var(--dim); }
.btn.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
.btn.danger { background: var(--high-bg); color: var(--high-text); border-color: var(--high); }
.btn.ok { background: var(--ok-bg); color: var(--ok-text); border-color: var(--ok); }
.btn.small { padding: 3px 8px; font-size: 10px; }

.count-tag { font-size: 10px; color: var(--muted); margin-left: 4px; }

/* ---- grid ---- */
.main { flex: 1; overflow-y: auto; padding: 16px 20px; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 12px;
}

/* ---- card ---- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: border-color 0.15s;
}
.card:hover { border-color: var(--border2); }

.card.priority-HIGH { border-left: 3px solid var(--high); }
.card.priority-MEDIUM { border-left: 3px solid var(--med); }
.card.priority-LOW { border-left: 3px solid var(--low); }

.card-img {
  aspect-ratio: 16/9;
  background: #000;
  overflow: hidden;
  position: relative;
}
.card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-img .no-img {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 10px;
}

.card-meta { padding: 10px 12px; flex: 1; }

.card-top {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.pill {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.pill.no_helmet { background: var(--med-bg); color: var(--med-text); border: 1px solid var(--med); }
.pill.red_light_jump { background: var(--high-bg); color: var(--high-text); border: 1px solid var(--high); }
.pill.plate_unreadable { background: var(--low-bg); color: var(--low-text); border: 1px solid var(--low); }
.pill.wrong_way { background: var(--high-bg); color: var(--high-text); border: 1px solid var(--high); }
.pill.triple_riding { background: var(--med-bg); color: var(--med-text); border: 1px solid var(--med); }
.pill.overspeed { background: var(--med-bg); color: var(--med-text); border: 1px solid var(--med); }
.pill.watchlist_hit { background: #1a0014; color: #f07ad4; border: 1px solid #8a2060; }
.pill.pending { background: #111108; color: #d4c840; border: 1px solid #6a6408; }
.pill.approved { background: var(--ok-bg); color: var(--ok-text); border: 1px solid var(--ok); }
.pill.rejected { background: var(--high-bg); color: var(--high-text); border: 1px solid var(--high); }

.plate-text {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.08em;
  color: var(--accent);
  margin-bottom: 4px;
}
.plate-text.none { color: var(--muted); font-weight: 400; font-size: 11px; }

.card-row {
  display: flex;
  justify-content: space-between;
  gap: 4px;
  font-size: 10px;
  color: var(--muted);
  margin-top: 4px;
}
.card-row .val { color: var(--dim); }

.conf-bar {
  height: 3px;
  border-radius: 2px;
  margin-top: 6px;
  background: var(--border);
  overflow: hidden;
}
.conf-bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }

.plate-crop-row {
  margin-top: 8px;
  height: 40px;
  background: #000;
  border-radius: 3px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.plate-crop-row img { max-height: 100%; max-width: 100%; object-fit: contain; }
.plate-crop-row .no-crop { font-size: 10px; color: var(--muted); }

.extra-tag {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 10px;
  background: var(--surface2);
  color: var(--dim);
  border: 1px solid var(--border2);
  margin-top: 4px;
}

.card-actions {
  padding: 8px 12px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 6px;
}

/* ---- empty state ---- */
.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 20px;
  color: var(--muted);
  font-size: 12px;
}

/* ---- pane ---- */
.pane { display: none; flex: 1; overflow-y: auto; }
.pane.active { display: flex; flex-direction: column; }

/* ---- analytics ---- */
.analytics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
  padding: 16px 20px;
}
.chart-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px;
}
.chart-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
}
.bar-chart { display: flex; flex-direction: column; gap: 6px; }
.bar-row { display: flex; align-items: center; gap: 8px; }
.bar-label { width: 120px; font-size: 10px; color: var(--dim); text-align: right; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-track { flex: 1; height: 14px; background: var(--bg); border-radius: 2px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 2px; background: var(--border2); transition: width 0.4s; }
.bar-val { font-size: 10px; color: var(--muted); width: 30px; text-align: right; flex-shrink: 0; }

/* ---- watchlist ---- */
.wl-pane { padding: 16px 20px; }
.wl-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
.wl-table th, .wl-table td { padding: 8px 12px; text-align: left; font-size: 11px; border-bottom: 1px solid var(--border); }
.wl-table th { color: var(--muted); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.wl-table td { color: var(--dim); }
.wl-table .plate-col { color: var(--accent); font-weight: 700; letter-spacing: 0.08em; }
.wl-add-row { display: flex; gap: 8px; margin-top: 12px; }

/* ---- login overlay ---- */
#login-overlay {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.login-box {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 32px;
  width: 320px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.login-box h2 { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
.login-box label { font-size: 10px; color: var(--muted); display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.08em; }
.login-box input { width: 100%; }
.login-error { font-size: 11px; color: var(--high-text); display: none; }

/* ---- notification toast ---- */
.toast-area { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 200; pointer-events: none; }
.toast {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 5px;
  padding: 8px 14px;
  font-size: 11px;
  color: var(--fg);
  animation: slideIn 0.2s ease;
  max-width: 280px;
}
.toast.priority-HIGH { border-left: 3px solid var(--high); }
.toast.priority-MEDIUM { border-left: 3px solid var(--med); }
@keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ---- scrollbar ---- */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<div id="login-overlay">
  <div class="login-box">
    <h2>Enforcement Console</h2>
    <div>
      <label>Email</label>
      <input id="login-email" type="email" placeholder="admin@local" autocomplete="username">
    </div>
    <div>
      <label>Password</label>
      <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="login-error" id="login-error"></div>
    <button class="btn primary" id="login-btn">Sign in</button>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <span class="brand">⬛ CCTV Enforcement</span>
    <div id="live-indicator" class="live-dot dead" title="WebSocket"></div>
    <div class="stats-row" id="stats"></div>
    <div class="header-right">
      <span class="user-tag" id="user-tag">—</span>
      <button class="btn small" id="logout-btn">Logout</button>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="violations">Violations</div>
    <div class="tab" data-tab="analytics">Analytics</div>
    <div class="tab" data-tab="watchlist">Watchlist</div>
    <div class="tab" data-tab="subjects">Subjects</div>
  </div>

  <!-- VIOLATIONS PANE -->
  <div class="pane active" id="pane-violations" style="flex-direction:column">
    <div class="filterbar">
      <select id="f-status">
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
        <option value="">All</option>
      </select>
      <select id="f-code">
        <option value="">All types</option>
        <option value="no_helmet">No helmet</option>
        <option value="red_light_jump">Red light</option>
        <option value="wrong_way">Wrong way</option>
        <option value="triple_riding">Triple riding</option>
        <option value="overspeed">Overspeed</option>
        <option value="plate_unreadable">Plate unreadable</option>
        <option value="watchlist_hit">Watchlist hit</option>
      </select>
      <input id="f-camera" placeholder="Camera ID" style="width:110px">
      <input id="f-plate" placeholder="Plate (e.g. TS09)" style="width:130px">
      <button class="btn primary" id="apply-btn">Apply</button>
      <span class="count-tag" id="count-tag"></span>
      <span style="flex:1"></span>
      <button class="btn small" id="bulk-approve-btn">Bulk Approve Selected</button>
    </div>
    <div class="main">
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <!-- ANALYTICS PANE -->
  <div class="pane" id="pane-analytics" style="flex-direction:column">
    <div class="analytics-grid" id="analytics-content">
      <div class="chart-card">
        <div class="chart-title">By Violation Type</div>
        <div class="bar-chart" id="chart-code"></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">By Camera</div>
        <div class="bar-chart" id="chart-camera"></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Review Status</div>
        <div class="bar-chart" id="chart-status"></div>
      </div>
    </div>
  </div>

  <!-- WATCHLIST PANE -->
  <div class="pane" id="pane-watchlist" style="flex-direction:column">
    <div class="wl-pane">
      <div class="wl-add-row">
        <input id="wl-plate" placeholder="Plate pattern (e.g. TS09AB1234)" style="width:200px">
        <input id="wl-reason" placeholder="Reason (optional)" style="flex:1">
        <button class="btn danger" id="wl-add-btn">+ Add to watchlist</button>
      </div>
      <table class="wl-table">
        <thead>
          <tr><th>Plate Pattern</th><th>Reason</th><th>Added</th><th></th></tr>
        </thead>
        <tbody id="wl-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- SUBJECTS PANE (cross-camera ReID) -->
  <div class="pane" id="pane-subjects" style="flex-direction:column">
    <div class="wl-pane">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:11px;color:var(--muted)">Vehicles tracked across multiple cameras (live ReID store)</span>
        <button class="btn small" id="subjects-refresh-btn">Refresh</button>
      </div>
      <table class="wl-table">
        <thead>
          <tr><th>Identity</th><th>Plate</th><th>Color</th><th>Type</th><th>Cameras</th><th>Last Seen</th><th>Matches</th></tr>
        </thead>
        <tbody id="subjects-tbody"></tbody>
      </table>
      <div id="subjects-stats" style="margin-top:12px;font-size:10px;color:var(--muted)"></div>
    </div>
  </div>
</div>

<div class="toast-area" id="toast-area"></div>

<script>
// ---- state ----
let TOKEN = localStorage.getItem('token') || '';
let USER_ROLE = localStorage.getItem('role') || '';
let USER_NAME = localStorage.getItem('name') || '';
let _ws = null;
let _selected = new Set();
const PRIORITY = {
  watchlist_hit: 'HIGH', wrong_way: 'HIGH', red_light_jump: 'HIGH',
  no_helmet: 'MEDIUM', triple_riding: 'MEDIUM', overspeed: 'MEDIUM',
  plate_unreadable: 'LOW'
};
const CODE_LABEL = {
  no_helmet: 'No Helmet', red_light_jump: 'Red Light', plate_unreadable: 'Plate Unreadable',
  wrong_way: 'Wrong Way', triple_riding: 'Triple Riding', overspeed: 'Overspeed',
  watchlist_hit: 'Watchlist Hit'
};

// ---- API ----
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const r = await fetch(path, { ...opts, headers });
  if (r.status === 401) { logout(); throw new Error('Unauthorized'); }
  return r;
}

// ---- Login ----
document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  err.style.display = 'none';
  try {
    const r = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    if (!r.ok) { err.textContent = 'Invalid credentials'; err.style.display = 'block'; return; }
    const data = await r.json();
    TOKEN = data.access_token;
    USER_ROLE = data.role;
    USER_NAME = data.full_name || email;
    localStorage.setItem('token', TOKEN);
    localStorage.setItem('role', USER_ROLE);
    localStorage.setItem('name', USER_NAME);
    showApp();
  } catch (e) { err.textContent = 'Network error'; err.style.display = 'block'; }
}

function logout() {
  TOKEN = ''; USER_ROLE = ''; USER_NAME = '';
  localStorage.removeItem('token'); localStorage.removeItem('role'); localStorage.removeItem('name');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-overlay').style.display = 'flex';
  if (_ws) { _ws.close(); _ws = null; }
}

document.getElementById('logout-btn').addEventListener('click', logout);

function showApp() {
  document.getElementById('login-overlay').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('user-tag').textContent = USER_NAME + ' · ' + USER_ROLE;
  initWS();
  loadStats();
  loadViolations();
  setInterval(loadStats, 10000);
}

if (TOKEN) showApp();

// ---- Tabs ----
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    const pane = document.getElementById('pane-' + tab.dataset.tab);
    if (pane) pane.classList.add('active');
    if (tab.dataset.tab === 'analytics') loadAnalytics();
    if (tab.dataset.tab === 'watchlist') loadWatchlist();
    if (tab.dataset.tab === 'subjects') loadSubjects();
  });
});

// ---- Stats ----
async function loadStats() {
  try {
    const r = await api('/api/stats');
    if (!r.ok) return;
    const s = await r.json();
    document.getElementById('stats').innerHTML = `
      <span>Total <span class="val">${s.total}</span></span>
      <span>Pending <span class="val warn">${s.pending}</span></span>
      <span>Approved <span class="val ok">${s.approved}</span></span>
      <span>Rejected <span class="val high">${s.rejected}</span></span>
      <span>24h <span class="val">${s.last_24h}</span></span>
    `;
  } catch(_) {}
}

// ---- Violations ----
async function loadViolations() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const params = new URLSearchParams();
    const st = document.getElementById('f-status').value;
    if (st) params.set('status', st);
    const code = document.getElementById('f-code').value;
    if (code) params.set('code', code);
    const cam = document.getElementById('f-camera').value.trim();
    if (cam) params.set('camera_id', cam);
    const plate = document.getElementById('f-plate').value.trim();
    if (plate) params.set('plate', plate);
    params.set('limit', '80');
    const r = await api('/api/violations?' + params);
    if (!r.ok) { grid.innerHTML = '<div class="empty">API error</div>'; return; }
    const items = await r.json();
    document.getElementById('count-tag').textContent = items.length + ' results';
    if (!items.length) { grid.innerHTML = '<div class="empty">No violations found.</div>'; return; }
    grid.innerHTML = items.map(cardHTML).join('');
    grid.querySelectorAll('[data-act]').forEach(btn => btn.addEventListener('click', onAction));
    grid.querySelectorAll('.card-select').forEach(cb => cb.addEventListener('change', onSelect));
  } catch(e) { grid.innerHTML = '<div class="empty">Failed — check console</div>'; console.error(e); }
}

function confColor(c) {
  if (c >= 0.75) return 'var(--high-text)';
  if (c >= 0.45) return 'var(--med-text)';
  return 'var(--low-text)';
}

function cardHTML(v) {
  const ts = new Date(v.timestamp + 'Z').toLocaleString('en-IN', { hour12: false, timeZone: 'Asia/Kolkata' });
  const img = v.annotated_url || v.frame_url;
  const conf = v.rule_confidence || 0;
  const priority = PRIORITY[v.code] || 'LOW';
  const label = CODE_LABEL[v.code] || v.code;
  const isPending = v.status === 'pending';
  const plate = v.plate_text
    ? `<div class="plate-text">${v.plate_text}</div>`
    : `<div class="plate-text none">plate unread</div>`;
  const extras = v.extras ? (() => {
    const tags = [];
    const ex = v.extras;
    if (ex.vehicle_color) tags.push(`<span class="extra-tag">🎨 ${ex.vehicle_color}</span>`);
    if (ex.vehicle_type)  tags.push(`<span class="extra-tag">${ex.vehicle_type.replace(/_/g,' ')}</span>`);
    if (ex.speed_kmh)     tags.push(`<span class="extra-tag" style="color:var(--high-text)">${ex.speed_kmh} km/h</span>`);
    if (ex.rider_count)   tags.push(`<span class="extra-tag">${ex.rider_count} riders</span>`);
    if (ex.watchlist_reason && ex.watchlist_reason) tags.push(`<span class="extra-tag" style="color:#f07ad4">⚑ ${ex.watchlist_reason}</span>`);
    if (ex.reid_global_id) tags.push(`<span class="extra-tag" style="color:var(--muted)" title="${ex.reid_global_id}">ID:${ex.reid_global_id.slice(0,8)}</span>`);
    return tags.join(' ');
  })() : '';
  const selectBox = isPending
    ? `<input type="checkbox" class="card-select" data-id="${v.id}" style="margin-left:auto">`
    : '';
  return `
<div class="card priority-${priority}" data-id="${v.id}">
  <div class="card-img">
    ${img ? `<img src="${img}" loading="lazy" alt="">` : '<div class="no-img">no image</div>'}
  </div>
  <div class="card-meta">
    <div class="card-top">
      <span class="pill ${v.code}">${label}</span>
      <span class="pill ${v.status}">${v.status}</span>
      ${selectBox}
    </div>
    ${plate}
    <div class="conf-bar"><div class="conf-bar-fill" style="width:${(conf*100).toFixed(0)}%;background:${confColor(conf)}"></div></div>
    <div class="card-row">
      <span>OCR <span class="val">${((v.plate_ocr_confidence||0)*100).toFixed(0)}%</span></span>
      <span>Rule <span class="val">${(conf*100).toFixed(0)}%</span></span>
    </div>
    <div class="card-row">
      <span class="val">${v.camera_id}</span>
      <span>track <span class="val">#${v.track_id}</span></span>
    </div>
    <div class="card-row"><span style="color:var(--muted)">${ts}</span></div>
    ${extras ? `<div style="margin-top:6px">${extras}</div>` : ''}
    <div class="plate-crop-row">
      ${v.plate_crop_url
        ? `<img src="${v.plate_crop_url}" alt="plate crop">`
        : '<span class="no-crop">no plate crop</span>'}
    </div>
  </div>
  ${isPending ? `<div class="card-actions">
    <button class="btn ok small" data-act="approve" data-id="${v.id}">Approve</button>
    <button class="btn danger small" data-act="reject" data-id="${v.id}">Reject</button>
  </div>` : ''}
</div>`;
}

function onSelect(e) {
  const id = parseInt(e.target.dataset.id);
  if (e.target.checked) _selected.add(id);
  else _selected.delete(id);
}

async function onAction(e) {
  const id = e.currentTarget.dataset.id;
  const act = e.currentTarget.dataset.act;
  const notes = act === 'reject' ? (prompt('Rejection reason (optional)?') || '') : '';
  try {
    const r = await api('/api/violations/' + id + '/' + act, {
      method: 'POST',
      body: JSON.stringify({ notes: notes || null }),
    });
    if (!r.ok) { const err = await r.json(); alert(err.detail || 'Error'); return; }
  } catch(e) { alert('Network error'); return; }
  loadStats(); loadViolations();
}

document.getElementById('apply-btn').addEventListener('click', loadViolations);
document.getElementById('f-status').addEventListener('change', loadViolations);
document.getElementById('f-code').addEventListener('change', loadViolations);

document.getElementById('bulk-approve-btn').addEventListener('click', async () => {
  if (!_selected.size) { alert('Select violations first'); return; }
  if (!confirm(`Approve ${_selected.size} violations?`)) return;
  const r = await api('/api/violations/bulk_approve', {
    method: 'POST',
    body: JSON.stringify({ ids: [..._selected] }),
  });
  if (r.ok) { _selected.clear(); loadStats(); loadViolations(); }
});

// ---- WebSocket ----
function initWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws/events`);
  _ws = ws;
  const dot = document.getElementById('live-indicator');

  ws.onopen = () => { dot.classList.remove('dead'); };
  ws.onclose = () => {
    dot.classList.add('dead');
    setTimeout(initWS, 5000);
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'ping') return;
    showToast(msg);
    // refresh violations if showing pending
    if (document.getElementById('f-status').value === 'pending') loadViolations();
  };
}

function showToast(v) {
  const area = document.getElementById('toast-area');
  const priority = PRIORITY[v.code] || 'LOW';
  const label = CODE_LABEL[v.code] || v.code;
  const div = document.createElement('div');
  div.className = `toast priority-${priority}`;
  div.textContent = `[${v.camera_id}] ${label} — ${v.plate_text || 'no plate'}`;
  area.appendChild(div);
  setTimeout(() => div.remove(), 5000);
}

// ---- Analytics ----
async function loadAnalytics() {
  try {
    const r = await api('/api/stats');
    if (!r.ok) return;
    const s = await r.json();
    renderBars('chart-code', s.by_code, CODE_LABEL);
    renderBars('chart-camera', s.by_camera);
    renderBars('chart-status', { pending: s.pending, approved: s.approved, rejected: s.rejected });
  } catch(_) {}
}

function renderBars(id, data, labelMap = {}) {
  const el = document.getElementById(id);
  const entries = Object.entries(data).sort((a, b) => b[1] - a[1]);
  const max = entries.reduce((m, [, v]) => Math.max(m, v), 1);
  el.innerHTML = entries.map(([k, v]) => `
    <div class="bar-row">
      <div class="bar-label">${labelMap[k] || k}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(v/max*100).toFixed(0)}%"></div></div>
      <div class="bar-val">${v}</div>
    </div>
  `).join('');
}

// ---- Watchlist ----
async function loadWatchlist() {
  try {
    const r = await api('/api/watchlist');
    if (!r.ok) return;
    const items = await r.json();
    const tbody = document.getElementById('wl-tbody');
    tbody.innerHTML = items.map(w => `
      <tr>
        <td class="plate-col">${w.plate_pattern}</td>
        <td>${w.reason || '—'}</td>
        <td>${new Date(w.added_at).toLocaleDateString('en-IN')}</td>
        <td><button class="btn danger small" data-wid="${w.id}" onclick="removeWatchlist(${w.id})">Remove</button></td>
      </tr>
    `).join('') || '<tr><td colspan="4" style="color:var(--muted);padding:16px">No entries</td></tr>';
  } catch(_) {}
}

async function removeWatchlist(id) {
  if (!confirm('Remove from watchlist?')) return;
  await api('/api/watchlist/' + id, { method: 'DELETE' });
  loadWatchlist();
}

document.getElementById('wl-add-btn').addEventListener('click', async () => {
  const plate = document.getElementById('wl-plate').value.trim();
  const reason = document.getElementById('wl-reason').value.trim();
  if (!plate) { alert('Enter a plate pattern'); return; }
  const r = await api('/api/watchlist', {
    method: 'POST',
    body: JSON.stringify({ plate_pattern: plate, reason: reason || null }),
  });
  if (r.ok) {
    document.getElementById('wl-plate').value = '';
    document.getElementById('wl-reason').value = '';
    loadWatchlist();
  } else {
    const err = await r.json();
    alert(err.detail || 'Error adding');
  }
});

// ---- Subjects (ReID) ----
async function loadSubjects() {
  try {
    const r = await api('/api/reid/subjects?limit=100');
    const subjects = r.ok ? await r.json() : [];
    const tbody = document.getElementById('subjects-tbody');
    tbody.innerHTML = subjects.map(s => {
      const lastSeen = s.last_seen
        ? new Date(s.last_seen * 1000).toLocaleString('en-IN', {hour12:false, timeZone:'Asia/Kolkata'})
        : '—';
      const multi = s.cameras && s.cameras.length > 1;
      return `<tr style="${multi ? 'background:var(--surface2)' : ''}">
        <td style="font-size:10px;color:var(--muted)">${(s.global_id||'').slice(0,8)}…</td>
        <td class="plate-col">${s.plate_text || '—'}</td>
        <td>${s.vehicle_color || '—'}</td>
        <td>${(s.vehicle_type||'').replace(/_/g,' ') || '—'}</td>
        <td style="color:${multi ? 'var(--med-text)' : 'var(--dim)'}">${(s.cameras||[]).join(', ')}</td>
        <td style="color:var(--muted)">${lastSeen}</td>
        <td style="color:${multi ? 'var(--high-text)' : 'var(--dim)'};font-weight:${multi ? 700 : 400}">${s.match_count || 1}</td>
      </tr>`;
    }).join('') || '<tr><td colspan="7" style="color:var(--muted);padding:16px">No subjects — pipeline not running or no cross-camera matches yet</td></tr>';

    // Load stats
    const rs = await api('/api/reid/stats');
    if (rs.ok) {
      const stats = await rs.json();
      const el = document.getElementById('subjects-stats');
      if (stats.enabled) {
        el.textContent = `Backend: ${stats.backend} · Entries: ${stats.entries} · Unique IDs: ${stats.unique_ids} · Cameras: ${(stats.cameras||[]).join(', ')}`;
      } else {
        el.textContent = 'ReID: pipeline not running';
      }
    }
  } catch(e) { console.error('subjects error', e); }
}

document.getElementById('subjects-refresh-btn').addEventListener('click', loadSubjects);

// ---- keyboard shortcuts ----
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'r') loadViolations();
});
</script>
