# Tunable parameters for the violation rules engine.
# Keep all magic numbers here so police/ops can adjust without code changes.

# ---- Global alert engine ---------------------------------------------------
alert_engine:
  enabled: true                    # master kill-switch; false = no alerts fire
  # Per-priority cooldowns (seconds): same plate + same rule within this window = suppressed
  cooldown_HIGH: 30
  cooldown_MEDIUM: 60
  cooldown_LOW: 120

# ---- Individual rules -------------------------------------------------------

helmet:
  enabled: true
  # A "rider" track must be observed without a helmet for at least this many
  # consecutive frames before the rule fires. Prevents single-frame flickers.
  min_consecutive_no_helmet_frames: 8
  # Minimum IoU between a person box and a 2-wheeler box to call them a rider.
  rider_match_iou: 0.05
  # Minimum confidence for the helmet detector head.
  helmet_conf: 0.45

red_light:
  enabled: true
  # The signal must be classified RED for at least this many frames before
  # the rule starts evaluating crossings (debounce).
  red_debounce_frames: 5
  # A track is considered to have crossed the stop line if its previous
  # frame was on the lawful side and the current frame is past it, while
  # moving in the lawful direction.
  min_speed_px_per_frame: 1.5
  # Cooldown so we don't fire twice for the same vehicle.
  per_track_cooldown_seconds: 30

plate_unreadable:
  enabled: true
  # Fire only when the vehicle has been tracked through the enforcement zone
  # for at least this many frames AND no plate read ever cleared the
  # OCR_AUTO_ACCEPT threshold.
  min_track_frames: 25
  # Skip very small/distant detections — they're naturally unreadable and
  # would produce useless evidence.
  min_plate_pixel_area: 800

wrong_way:
  enabled: true
  # Minimum frames vehicle must be moving against lawful direction before firing.
  min_frames_wrong_way: 10
  # Dot product with the anti-direction must exceed this (ensures movement, not noise).
  min_speed_px_per_frame: 2.0
  # Cooldown per track (seconds).
  per_track_cooldown_seconds: 45

triple_riding:
  enabled: true
  # Number of riders (persons) overlapping the two-wheeler to trigger.
  min_rider_count: 3
  # Minimum frames the triple-riding must be sustained.
  min_consecutive_frames: 6
  # IOU threshold for person-on-bike overlap (fraction of person box contained in bike box).
  person_bike_overlap: 0.30
  per_track_cooldown_seconds: 60

overspeed:
  enabled: false       # needs per-camera meters_per_pixel calibration first
  # Speed threshold in km/h. Indian urban road default.
  threshold_kmh: 60
  # Minimum frames to accumulate velocity estimate.
  min_frames_for_estimate: 5
  # Per-camera calibration: meters per pixel (set via calibrate.py --speed).
  # Leave 0.0 to disable per camera if not calibrated.
  default_meters_per_pixel: 0.05
  per_track_cooldown_seconds: 30

watchlist:
  enabled: true
  # Watchlist hits bypass all other cooldowns; always fire.
  # Match modes: "exact" or "prefix" (matches state code prefix e.g. "TS09")
  match_mode: "prefix"
