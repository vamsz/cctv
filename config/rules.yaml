# Tunable parameters for the violation rules engine.
# All thresholds are calibrated for Indian traffic and crowd conditions:
#   - Roads are densely mixed (two-wheelers, autos, vehicles, pedestrians)
#   - Crowd density is routinely 3-5× higher than Western baselines
#   - Driver behaviour includes animated gestures (not to be flagged as violence)
#   - Markets, railway stations, temples have sustained standing/sitting crowds
# Keep all magic numbers here — no restarts needed for rule enable/disable.

# ---- Global alert engine ---------------------------------------------------
alert_engine:
  enabled: true
  # Per-priority cooldowns (seconds): same plate + same rule = suppressed
  cooldown_HIGH: 30
  cooldown_MEDIUM: 60
  cooldown_LOW: 120

# ---- Individual rules -------------------------------------------------------

helmet:
  # Disabled — surveillance system, not traffic enforcement.
  enabled: false
  min_consecutive_no_helmet_frames: 10
  rider_match_iou: 0.05
  helmet_conf: 0.40

red_light:
  enabled: false    # requires calibrated stop_line + signal_roi per camera
  # Signal must be RED for this many frames before checking crossings.
  red_debounce_frames: 5
  min_speed_px_per_frame: 1.5
  per_track_cooldown_seconds: 30

plate_unreadable:
  # Disabled by default — was firing for every passing vehicle whose plate
  # the OCR couldn't lock on (tiny / blurry / oblique angle). For real
  # enforcement, plates are read passively and attached to OTHER violations
  # (no_helmet, triple_riding, watchlist_hit) — not flagged on their own.
  enabled: false
  min_track_frames: 90              # 3 s at 30 fps — only long-visible vehicles
  min_plate_pixel_area: 600

wrong_way:
  enabled: false    # requires calibrated stop_line + direction per camera
  # Min frames driving against lawful direction before firing.
  min_frames_wrong_way: 10
  min_speed_px_per_frame: 2.0
  per_track_cooldown_seconds: 45

triple_riding:
  # Disabled — surveillance focus, not traffic enforcement.
  enabled: false
  min_rider_count: 3
  min_consecutive_frames: 6
  person_bike_overlap: 0.30
  per_track_cooldown_seconds: 60

overspeed:
  enabled: false     # requires per-camera calibration
  threshold_kmh: 60
  min_frames_for_estimate: 5
  default_meters_per_pixel: 0.05
  per_track_cooldown_seconds: 30

watchlist:
  enabled: true
  match_mode: "prefix"

# ---- Crowd analytics — India-tuned -----------------------------------------
# Indian context: normal markets run 2-4 p/m², train stations 3-5 p/m².
# A festival crush is 7+ p/m². Calibrate accordingly to avoid alarm fatigue.

crowd:
  enabled: true
  # Density thresholds (people/m²)
  warning_density: 4.0      # elevated — normal market is 2-4, alert at 4+
  danger_density: 7.0       # Kumbh-class crush. 5 is too sensitive for India.
  # Absolute count thresholds (used when homography is unavailable)
  warning_count: 12
  danger_count: 25
  # Stampede risk score thresholds (composite 0-1)
  stampede_warning: 0.45
  stampede_critical: 0.70
  # Write a DB snapshot every N frames regardless of level (~10s at 15fps)
  snapshot_every_frames: 150

  # Stampede SIGNAL trigger thresholds (India-tuned higher baselines):
  # Indian crowds have high baseline divergence/counter-flow because
  # people walk in all directions simultaneously (bidirectional roads, etc.)
  stampede_divergence_min: 0.35    # was 0.25 in Western references
  stampede_convergence_min: 0.30
  stampede_variance_min: 3.0
  stampede_counter_flow_min: 0.30  # was 0.20; normal Indian crowds are 0.15-0.25

# ---- Violence detection — India-tuned --------------------------------------
# Indians gesture animatedly in normal conversation. Raise thresholds to
# avoid false positives from normal heated argument / bargaining gestures.
# Stage-2: R3D-18 Kinetics-400 clip classifier confirms before "active" escalation.

violence:
  enabled: true
  run_every_n_frames: 3
  kp_confidence: 0.40
  # Pose Stage-1 thresholds — kept conservative because Stage-1 is now ONLY
  # a fast acceleration trigger; VideoMAE drives the actual incident state.
  wrist_velocity_threshold: 12.0
  proximity_iou: 0.08
  incident_cooldown_seconds: 60
  # Stage-2: VideoMAE UCF-Crime (primary) — runs as the source of truth.
  clip_model: "r3d_18"
  # Threshold is applied to the SUM of violence-class probabilities. With the
  # smarter scoring rule the system also fires when the top-1 is itself a
  # violence class above 0.21, OR when any single violence class > 0.52.
  clip_confirm_threshold: 0.35
  # How often to poll VideoMAE when nothing has explicitly triggered it.
  # 120 frames @ 30 fps = ~4 s — keeps GPU budget low when many cameras are
  # running; CLIP per-frame catches brief actions in the meantime.
  clip_poll_interval_frames: 120
  # Treat the latest VideoMAE result as quiet after this many frames without
  # a fresh positive — lets the IncidentManager auto-resolve.
  clip_stale_after_frames: 180     # ~6 s

  # ── CLIP zero-shot per-frame classifier ───────────────────────────────
  # Replaces the old jaranohaal/RLVS ViT (which was unloadable on torch 2.5).
  # Uses openai/clip-vit-base-patch32 with competing prompt sets:
  #   violent: "two people fighting", "physical violence", ...
  #   normal:  "cars driving on a road", "a normal street scene", ...
  # Per-frame threshold = 0.55 (above this in window vote = confirmed)
  # Strong threshold = 0.75 with normal_score < 0.25 = single-frame override
  # Window of 8 frames, 4 must be positive for a confirmed call.
  frame_per_frame_threshold: 0.55
  frame_strong_threshold: 0.75
  frame_strong_normal_max: 0.25
  frame_window: 8
  frame_min_positive: 4
  # 12 frames @ 30 fps = 2.5 Hz CLIP — half the load of every-6-frames,
  # still gets ≥4 verdicts in the 4-second decision window.
  frame_run_every_n: 12

# ---- Loitering detection — India-tuned ------------------------------------
# Street vendors, tea stalls, autorickshaw drivers routinely sit for hours.
# A meaningful loitering flag needs a much longer window than Western standards.

loitering:
  enabled: true
  # Default threshold if not set per zone
  default_threshold_seconds: 120   # 2 min. Western default was 30s — too aggressive.
  min_track_frames: 15
  cooldown_seconds: 120

# ---- Abandoned object detection — owner-association (upgraded) ------------
# Now uses YOLO luggage classes (backpack=24, handbag=26, suitcase=28) +
# owner binding (nearest person within bind_radius at first sight).
# Falls back to MOG2 background subtraction when no luggage detected.
# Reference: Russel & Selvaraj 2024 (Vis Comput 40:4401-4426)

abandoned:
  enabled: true
  min_frames: 600                  # ~20 s at 30fps — Indian street clutter is high,
                                   # require longer dwell to avoid parked-bag spam
  min_area_px2: 3000
  person_iou_threshold: 0.15
  owner_bind_radius_px: 200        # max pixels to bind owner at object first-sight
  owner_separation_px: 300         # owner "away" if centroid > this from object
  static_frames: 300               # object must be stationary for this long

# ---- Dense crowd counting — correction above 30 persons/frame -------------
# YOLO person detection saturates above ~30 heads/frame (Kumbh-level crowds).
# Enable CLIP-EBC for better accuracy: git clone CLIP-EBC && pip install -e.
# Without CLIP-EBC, an empirical correction factor is applied automatically.

crowd_dense:
  dense_trigger_count: 30          # switch to dense mode above this YOLO count
